name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q EvoFoxBridge-Mapper.zip
      - name: Fix Java target and code
        run: |
          sed -i 's/^android {/android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = "17" }/' EvoFoxBridge/app/build.gradle.kts
          sed -i 's/event\.isGamepadButton/KeyEvent.isGamepadButton(keyCode)/g' EvoFoxBridge/app/src/main/java/com/varun/evofoxbridge/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: EvoFoxBridge
      - uses: actions/upload-artifact@v4
        with:
          name: EvoFoxBridge-apk
          path: EvoFoxBridge/app/build/outputs/apk/debug/app-debug.apk
